<style>
/* Layout: Handy-App mit fester Navigation unten. Vier Reisetage als Zeitleiste, Budget, Verkehr und Checklisten. Farben aus Ostsee, Backstein und Bernstein. */
:root{
  --bg:#EBF0F1; --surface:#FFFFFF; --ink:#14262E; --muted:#4F646D; --line:#CBD6DA;
  --deep:#17394A; --on-deep:#F2F7F8; --primary:#1F5568; --on-primary:#FFFFFF;
  --amber:#E3A62F; --amber-bg:#FBEFD2; --amber-ink:#6B4300;
  --brick:#9A3B2B; --warn-bg:#F8E4DF; --ok:#1F7A4F; --ok-bg:#DCEFE5; --chip:#DDE7EA;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1B21; --surface:#162830; --ink:#E5EDEF; --muted:#9BB0B8; --line:#2A424C;
  --deep:#0A141A; --on-deep:#EAF2F4; --primary:#74B6CA; --on-primary:#0E1B21;
  --amber:#E8B04A; --amber-bg:#3A2D14; --amber-ink:#F0CF8C;
  --brick:#EE9482; --warn-bg:#3C2420; --ok:#6CCB9B; --ok-bg:#15332A; --chip:#223A44; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1B21; --surface:#162830; --ink:#E5EDEF; --muted:#9BB0B8; --line:#2A424C;
  --deep:#0A141A; --on-deep:#EAF2F4; --primary:#74B6CA; --on-primary:#0E1B21;
  --amber:#E8B04A; --amber-bg:#3A2D14; --amber-ink:#F0CF8C;
  --brick:#EE9482; --warn-bg:#3C2420; --ok:#6CCB9B; --ok-bg:#15332A; --chip:#223A44; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);padding-bottom:88px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--deep);z-index:10}
.in{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--primary)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

header{background:var(--deep);color:var(--on-deep);padding-block:22px 20px}
header .kicker{font:500 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
header h1{font-size:2.1rem;font-weight:800;margin-top:10px}
header p{margin:6px 0 0;opacity:.88}
.count{display:inline-block;margin-top:14px;background:var(--amber);color:#2B1B00;font:600 14px/1 var(--f-body);padding:8px 12px;border-radius:6px}

main{padding-block:18px 8px}
.view{display:flex;flex-direction:column;gap:14px}
.view[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h2{font-size:1.15rem;margin-bottom:8px}
.card h3{font-size:1rem;margin-bottom:4px}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:600 15px/1 var(--f-body);background:var(--primary);color:var(--on-primary);border:0;border-radius:8px;padding:12px 14px;text-decoration:none;display:inline-flex;align-items:center;min-height:44px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.btn:focus-visible,.tab:focus-visible,.nav button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
dl.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
dl.kv dt{color:var(--muted);font-size:.9rem}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

.tabs{display:flex;gap:6px;overflow-x:auto}
.tab{flex:1 0 auto;min-width:76px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:left;font:inherit;cursor:pointer}
.tab b{display:block;font:600 15px/1.2 var(--f-display)}
.tab span{font:400 12px/1.3 var(--f-mono);color:var(--muted)}
.tab[aria-selected="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.tab[aria-selected="true"] span{color:var(--on-primary);opacity:.85}

.dayhead h2{font-size:1.5rem;font-weight:800}
.wx{display:inline-block;margin-top:8px;background:var(--chip);border-radius:6px;padding:4px 10px;font-size:.92rem}
ol.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it time{font:500 14px/1.6 var(--f-mono);color:var(--primary)}
.it .t{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:3px}
.chip{font:500 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;background:var(--chip);color:var(--muted);padding:4px 6px;border-radius:4px}
.chip.essen{background:var(--amber-bg);color:var(--amber-ink)}
.chip.cost{background:var(--ok-bg);color:var(--ok)}
.chip.opt{background:transparent;border:1px dashed var(--muted)}
.check{margin-top:6px;background:var(--warn-bg);color:var(--ink);border-radius:6px;padding:6px 10px;font-size:.9rem}
.check b{color:var(--brick)}
.alt{background:var(--amber-bg);color:var(--ink)}
.alt h3{color:var(--amber-ink)}

table{width:100%;border-collapse:collapse}
th,td{padding:9px 6px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
thead th{border-top:0;font:500 12px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
tfoot td{font-weight:700;border-top:2px solid var(--ink)}
.tw{overflow-x:auto}
input[type=number]{font:inherit;width:96px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}

.ck{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.ck:first-of-type{border-top:0}
.ck input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--primary);flex:none}
.ck span{min-width:0}
.ck input:checked + span{text-decoration:line-through;color:var(--muted)}
.prog{font:500 12px/1 var(--f-mono);color:var(--muted)}

.it a.t{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-decoration-thickness:2px;text-underline-offset:3px}
.way{margin-top:3px;font:500 13px/1.4 var(--f-mono);color:var(--primary)}
.meal{margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:0 12px}
.meal summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--primary)}
.opt{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:2px}
.opt .oh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.go{display:inline-flex;align-items:center;min-height:40px;margin-top:8px;padding:0 12px;border-radius:8px;background:var(--chip);color:var(--primary);border:1px solid var(--line);font:600 14px/1 var(--f-body);text-decoration:none}
.next{background:var(--amber-bg)}
.next .chip{background:var(--amber);color:#2B1B00}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav div{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.nav button{background:transparent;border:0;color:var(--muted);font:600 12px/1.2 var(--f-body);padding:10px 2px;border-radius:8px;min-height:48px;cursor:pointer}
.nav button[aria-current="page"]{background:var(--chip);color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>

function dayIndexForToday(){
  const d = new Date(); const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  return DAYS.findIndex(x=>x.iso===key);
}
let cur = Math.max(0,dayIndexForToday());

function countdown(){
  const now = new Date(); const t0 = new Date(2026,9,20); const t1 = new Date(2026,9,23,23,59);
  const today0 = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const diff = Math.round((t0-today0)/86400000);
  if(diff>1) return 'Noch '+diff+' Tage bis zur Reise';
  if(diff===1) return 'Morgen geht es los';
  if(now<=t1){ const i=dayIndexForToday(); return 'Heute: Tag '+(i+1)+' von 4' }
  return 'Reise beendet. Schön war es hoffentlich.';
}

    if(nx) nextCard = `<div class="card next"><div class="chips"><span class="chip">Nächster Stopp · ${nx.t}</span></div><div style="font-weight:700;font-size:1.05rem">${nx.h}</div><a class="btn" style="margin-top:10px" href="${navUrl(nx)}" target="_blank" rel="noopener">Route starten · ${MODES[nx.m||'walking']}</a></div>`;
  }
  const tabs = DAYS.map((x,i)=>`<button class="tab" role="tab" aria-selected="${i===cur}" data-day="${i}" type="button"><b>${x.short}</b><span>${x.date}</span></button>`).join('');
  const items = d.items.map(it=>`
   <li class="it"><time>${it.t}</time><div>
    <div class="chips"><span class="chip ${it.k==='essen'?'essen':''}">${TYPES[it.k]}</span>${it.opt?'<span class="chip opt">optional</span>':''}${it.cost?`<span class="chip cost">${it.cost}</span>`:''}</div>
    ${it.p?`<a class="t" href="${navUrl(it)}" target="_blank" rel="noopener">${it.h}</a>`:`<div class="t">${it.h}</div>`}${it.n?`<div class="muted small">${it.n}</div>`:''}
    ${it.w?`<div class="way">${it.w}</div>`:''}
    ${it.chk?`<div class="check"><b>${it.lab||'Prüfen.'}</b> ${it.chk}</div>`:''}
    ${it.p?`<a class="go" href="${navUrl(it)}" target="_blank" rel="noopener">Route starten · ${MODES[it.m||'walking']}</a>`:''}
    ${it.meal?mealHtml(it.meal):''}
   </div></li>`).join('');
  $('#v-tage').innerHTML = `
   <button class="btn ghost" type="button" data-tab="start" style="align-self:flex-start">← Übersicht</button>
   <div class="tabs" role="tablist" aria-label="Reisetage">${tabs}</div>
   <div class="card dayhead"><h2>${d.title}</h2><span class="wx">${d.wx}</span>
    <p class="muted small" style="margin:10px 0 0">Verkehr: ${d.transport}</p></div>
   ${nextCard}${frueh}<div class="card"><p class="small muted" style="margin:0 0 4px">Tippen Sie auf einen Stopp. Google Maps öffnet die Route von Ihrem aktuellen Standort.</p><ol class="tl">${items}</ol></div>
   <div class="card alt"><h3>Wenn das Wetter nicht mitspielt</h3><div class="small">${d.alt}</div></div>
   <div class="card"><h3>Karten</h3><div class="row" style="margin-top:8px">${mapsBtns(d.maps)}</div></div>
   <div class="card"><h3>Tagesbudget für 4 Personen</h3>
    <div class="mono" style="font-size:1.25rem;font-weight:500">${fmt(d.budget[0])}–${fmt(d.budget[1])} PLN</div>
    <div class="muted small">${d.budgetNote}</div></div>`;
}

function renderVerkehr(){
  $('#v-verkehr').innerHTML = `
  <div class="card"><h2>Zu Fuß</h2><p style="margin:0">Dienstag und Mittwoch gehen Sie alles zu Fuß. Die Unterkunft liegt in der Altstadt.</p></div>
  <div class="card"><h2>Bus und Tram</h2>
   <dl class="kv"><dt>Einzelfahrt</dt><dd class="mono">4,80 PLN</dd><dt>75 Minuten</dt><dd class="mono">6 PLN</dd><dt>24 Stunden</dt><dd class="mono">22 PLN</dd></dl>
   <p class="small muted">Richtpreise aus dem Plan. Kind: Ermäßigung prüfen.</p></div>
  <div class="card"><h2>SKM nach Oliwa und Sopot</h2>
   <p style="margin:0 0 8px">Strecke am Donnerstag: Śródmieście → Oliwa → Sopot → zurück. Tickets am Bahnsteig-Automaten (auch auf Englisch) oder in der App kaufen. Städtische Tickets gelten laut Plan nicht automatisch in der SKM.</p>
   <div class="check"><b>Ticket klären.</b> In Sopot gilt laut einer Quelle: Ticket für die Fahrtrichtung kaufen, Danzig oder Gdynia. Planwert 8,50 PLN je Fahrt und Person ist eher hoch angesetzt und dient als Puffer.</div></div>
  <div class="card"><h2>Weg- und Fahrzeiten</h2><div class="tw"><table>
   <thead><tr><th>Strecke</th><th>Dauer</th></tr></thead><tbody>
    <tr><td>Flughafen ↔ Unterkunft (Taxi)</td><td>25–40 Min.</td></tr>
    <tr><td>Danzig ↔ Sopot (SKM)</td><td>ca. 15 Min.</td></tr>
    <tr><td>Danzig ↔ Oliwa (SKM)</td><td>ca. 15–25 Min.</td></tr>
    <tr><td>Bahnhof Oliwa ↔ Park (zu Fuß)</td><td>12–15 Min.</td></tr>
    <tr><td>Bahnhof Sopot ↔ Seebrücke (zu Fuß)</td><td>8–10 Min.</td></tr>
    <tr><td>Zwischen den Altstadt-Stopps (zu Fuß)</td><td>1–8 Min.</td></tr></tbody></table></div>
   <p class="small muted" style="margin-bottom:0">Schätzwerte. Der Button „Route starten“ zeigt in Google Maps die genaue Zeit ab Ihrem Standort.</p></div>
  <div class="card"><h2>Flughafen</h2>
   <dl class="kv"><dt>Dienstag</dt><dd>Taxi, Bolt oder Uber, etwa 40 Minuten</dd><dt>Freitag</dt><dd>Taxi 06:45, 25–40 Minuten, 60–130 PLN</dd></dl></div>
  <div class="card"><h2>Apps</h2><div class="row">
   <a class="btn ghost" href="https://jakdojade.pl" target="_blank" rel="noopener">Jakdojade</a>
   <a class="btn ghost" href="https://www.skm.pkp.pl" target="_blank" rel="noopener">SKM Trójmiasto</a></div>
   <p class="small muted" style="margin-bottom:0">Bolt und Uber für Taxifahrten und bei Regen.</p></div>`;
}

function renderBudget(){
  const lo = DAYS.reduce((a,d)=>a+d.budget[0],0), hi = DAYS.reduce((a,d)=>a+d.budget[1],0);
  let rate = 4.25; try{ const r=parseFloat(localStorage.getItem('danzig-rate')); if(r>0) rate=r }catch(e){}
  $('#v-budget').innerHTML = `
  <div class="card"><h2>Kosten für 4 Personen</h2><div class="tw"><table>
   <thead><tr><th>Tag</th><th>von</th><th>bis</th></tr></thead>
   <tbody>${DAYS.map(d=>`<tr><td>${d.short} ${d.date}</td><td>${fmt(d.budget[0])}</td><td>${fmt(d.budget[1])}</td></tr>`).join('')}</tbody>
   <tfoot><tr><td>Gesamt (PLN)</td><td>${fmt(lo)}</td><td>${fmt(hi)}</td></tr></tfoot></table></div>
   <p class="small muted" style="margin-bottom:0">Ohne Flug, Unterkunft, Souvenirs und Einkäufe. Alles sind Schätzwerte.</p></div>
  <div class="card"><h2>In Euro</h2>
   <label for="rate" class="small">Kurs: PLN je 1 EUR</label>
   <div class="row" style="margin:6px 0 10px"><input id="rate" type="number" inputmode="decimal" step="0.01" min="1" value="${rate}">
   <span class="small muted">Beispielkurs. Bitte aktuellen Kurs eintragen.</span></div>
   <dl class="kv" id="eur"></dl></div>`;
  const upd=()=>{
    const r=parseFloat($('#rate').value); if(!(r>0)){ $('#eur').innerHTML='<dt>Hinweis</dt><dd>Bitte einen Kurs über 0 eintragen.</dd>'; return }
    try{ localStorage.setItem('danzig-rate',String(r)) }catch(e){}
    $('#eur').innerHTML = `<dt>Gesamt</dt><dd class="mono">${fmt(lo/r)}–${fmt(hi/r)} EUR</dd>
     <dt>Pro Person</dt><dd class="mono">${fmt(lo/r/4)}–${fmt(hi/r/4)} EUR</dd>
     <dt>Pro Tag, Mittel</dt><dd class="mono">${fmt((lo+hi)/2/4/r)} EUR</dd>
     <dt>Beispiel 100 PLN</dt><dd class="mono">${fmt2(100/r)} EUR</dd>`;
  };
  $('#rate').oninput=upd; upd();
}

function renderCheck(){
  $('#v-check').innerHTML = CHECKS.map(g=>{
    const done = g.i.filter(([id])=>store[id]).length;
    return `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${g.g}</h2><span class="prog">${done}/${g.i.length}</span></div>
     <div style="margin-top:6px">${g.i.map(([id,t])=>`<label class="ck"><input type="checkbox" data-ck="${id}" ${store[id]?'checked':''}><span>${t}</span></label>`).join('')}</div></div>`;
  }).join('') + '<p class="small muted">Häkchen werden nur auf diesem Gerät gespeichert.</p>';
}

function show(tab,hash){
  $$('.view').forEach(v=>v.hidden = v.id!=='v-'+tab);
  $$('.nav button').forEach(b=>{ if(b.dataset.tab===tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current') });
  window.scrollTo(0,0);
  try{ history.replaceState(null,'','#'+(hash||tab)) }catch(e){}
}

document.addEventListener('click',e=>{
  const n=e.target.closest('[data-tab]'); if(n){ show(n.dataset.tab); return }
  const g=e.target.closest('[data-go]'); if(g){ cur=+g.dataset.go; renderDay(); show('tage','tag-'+cur); return }
  const d=e.target.closest('[data-day]'); if(d){ cur=+d.dataset.day; renderDay(); try{ history.replaceState(null,'','#tag-'+cur) }catch(e){} const t=$('#v-tage .tab[aria-selected="true"]'); if(t) t.focus(); }
});
document.addEventListener('change',e=>{
  const c=e.target.closest('[data-ck]'); if(c){ store[c.dataset.ck]=c.checked; save(); renderCheck(); const again=$(`[data-ck="${c.dataset.ck}"]`); if(again) again.focus() }
});

$('#count').textContent = countdown();
renderStart(); renderDay(); renderVerkehr(); renderBudget(); renderCheck();
function route(){ const h=(location.hash||'').replace('#',''); const m=h.match(/^tag-([0-3])$/); if(m){ cur=+m[1]; renderDay(); show('tage',h) } else show(['start','tage','verkehr','budget','check'].includes(h)?h:'start') }
window.addEventListener('hashchange',route); route();
</script>
</body>
</html>
